        <script>
            function redirectBasedOnLanguage() {
                // Get the preferred language of the user
                var lang = navigator.language || navigator.userLanguage; // navigator.language is the standard
                lang = lang.substring(0, 2); // Extract the language code
    
                // Determine the current path
                var currentPath = window.location.pathname;

                // Determine the target path based on the language
                var targetPath = lang === "fr" ? "/fr/" : "/en/";

                // Redirect if necessary
                if (currentPath !== targetPath) {
                    window.location.href = targetPath;
                }
            }
    
            // Call the function on page load
            window.onload = redirectBasedOnLanguage;
        </script>
