    <div class="pricing" style="display: none;">
        <div id="price-article" class="p-4" style="display:none;">
            <div class="card mx-auto" style="width: 32rem;">
                <div class="card-body">
                    <h5 class="card-title">Abonnement Article</h5>
                    <h6 class="card-subtitle mb-2 text-body-secondary">Accédez à tous les articles</h6>
                    <p class="card-text">Profitez d'un accès illimité à tous les articles publiés sur notre plateforme,

                    <div class="mb-3 mt-3 d-flex justify-content-start align-items-center">
                        <div class="form-check">

                            <input class="form-check-input" type="radio" name="paymentArticleOption"
                                id="paymentArticleOption1" value="particulier" checked>

                                Particulier (10 000 FCFA)
                            </label>

                        </div>
                        <div class="form-check ms-4">
                            <input class="form-check-input" type="radio" name="paymentArticleOption"
                                id="paymentArticleOption2" value="groupe">
                            <label class="form-check-label" for="paymentArticleOption2">
                                Groupe (15 000 FCFA)
                            </label>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button class="btn btn-primary px-4" id="payArticleBtn">Payer</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="price-learning" style="display: none;">
            abonnement formation
        </div>

        <div id="price-webinaire" style="display:none;">
            <div>
                <input type="radio" name="paymentOption" id="payment" value="groupe">
                <label for="paymentOption3">Groupe</label>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.kkiapay.me/k.js"></script>
    <script>
        const loading = document.querySelector('.loading-container');
        const pricingSection = document.querySelector('.pricing');
        const priceArticle = document.getElementById('price-article');
        const priceLearning = document.getElementById('price-learning');
        const priceWebinaire = document.getElementById('price-webinaire');


        const userToken = localStorage.getItem('userToken');
        const userID = localStorage.getItem('user_id')  // Utiliser 1 par défaut si l'ID n'est pas trouvé
        const params = new URLSearchParams(location.search);
        const transactionID = params.get('transaction_id') || '';
        const currentURL = location.href;

        // console.log('Current URL:', currentURL);
        const subscriptionType = params.get('type') || '';
        const id = params.get('id') || '';

        // initialisation des données 
        document.addEventListener('DOMContentLoaded', () => {
            // Vérifier si l'utilisateur est connecté
            if (!userToken) {
                location.href = 'connexion?next=payment?type=' + subscriptionType + '&id=' + id;
            }
            if (transactionID) {
                loading.style.display = 'flex';
                pricingSection.style.display = 'none';
                const paymentAmount = localStorage.getItem('paymentAmount') || 0;
                verificationPayment(transactionID, paymentAmount);
            }else {
                loading.style.display = 'none';
                pricingSection.style.display = 'block';
            }
            const typeExist = ['formation', 'webinaire', 'article'].includes(subscriptionType);

            if (userToken && !subscriptionType && !typeExist) {
                location.href = '../fr/';
            } else {
                priceArticle.style.display = subscriptionType === "article" ? 'block' : 'none';
                priceLearning.style.display = subscriptionType === "formation" ? 'block' : 'none';
                priceWebinaire.style.display = subscriptionType === "webinaire" ? 'block' : 'none';
            }
        });


        // Paiement article
        const payArticleBtn = document.getElementById('payArticleBtn');
        payArticleBtn.addEventListener('click', () => {
            const selectedOption = document.querySelector('input[name="paymentArticleOption"]:checked');
            const amount = selectedOption ? (selectedOption.value === 'particulier' ? 10000 : 15000) : 0;
            localStorage.setItem('paymentAmount', amount);
            handlePayment(amount);
        });

        // Fonction pour gérer le paiement
        const handlePayment = (amount) => {
            const apiKey = "2d60f1304a3711f0b843d576c84457a5"
            const callback = currentURL
            openKkiapayWidget({
                amount: amount,
                position: "center",
                callback: callback,
                theme: "green",
                sandbox: "true",
                paymentmethod: "momo",
                key: apiKey
            })
        }

        const verificationPayment = async (transactionID, paymentAmount) => {

            try {
                const endpoint = "https://imaneapi.auditacademie.com/api/abonnement_articles/";
                const data = {
                    montant_paye: paymentAmount,
                    methode_paiement: "Mobile Money",
                    reference_transaction: transactionID,
                }
                const options  = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}`
                    },
                    body: JSON.stringify(data)
                }
                console.log("data", data)
                const response = await fetch(endpoint, options);
                const responseData = await response.json();

                if (!response.ok) {
                throw new Error('Erreur lors de la vérification du paiement');
                loading.style.display = 'none';
                pricingSection.style.display = 'block';
                }
               
                localStorage.removeItem('paymentAmount');
                console.log("response", responseData)
                const aba = {
                    statut_abonnement: responseData.abonnement.statut_abonnement,
                    date_debut: responseData.abonnement.date_debut,
                    date_fin: responseData.abonnement.date_fin,
                }
                console.log("aba", aba)
                // Enregistrer les informations de l'abonnement dans le localStorage
                localStorage.setItem('abonnement_article', JSON.stringify(aba));
            
                location.href = "blog-details?id=" + id 
            } catch (error) {
                console.error('Erreur lors de la vérification du paiement:', error);
            }
        }
    </script>
