<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inavvo - Mot de passe oublié</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="../assets/images/faviconeimane.png" type="image/x-icon">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .background-container {
            position: relative;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mountain-silhouette {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0,0,0,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0,0,0,0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0,0,0,0.1) 0%, transparent 50%);
            z-index: 1;
        }

        .mountain-layer-1 {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(30, 58, 138, 0.8) 0%, transparent 100%);
            clip-path: polygon(0% 100%, 15% 60%, 35% 80%, 50% 40%, 70% 70%, 85% 50%, 100% 80%, 100% 100%);
            z-index: 2;
        }

        .mountain-layer-2 {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to top, rgba(59, 130, 246, 0.6) 0%, transparent 100%);
            clip-path: polygon(0% 100%, 20% 70%, 40% 90%, 60% 50%, 80% 80%, 100% 60%, 100% 100%);
            z-index: 3;
        }

        .floating-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 4;
        }

        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .dot:nth-child(1) { top: 20%; right: 15%; animation-delay: 0s; }
        .dot:nth-child(2) { top: 40%; right: 25%; animation-delay: 2s; }
        .dot:nth-child(3) { top: 60%; right: 20%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
        }

        .logo {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            z-index: 10;
        }

        .reset-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
            z-index: 10;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .email-icon {
            font-size: 3rem;
            color: #6c757d;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .email-icon::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 2px;
            background: #6c757d;
            border-radius: 1px;
        }

        .email-icon::after {
            content: '';
            position: absolute;
            left: -20px;
            top: 30%;
            width: 15px;
            height: 2px;
            background: #6c757d;
            border-radius: 1px;
        }

        .form-control {
            border-radius: 12px;
            border: 1px solid #e9ecef;
            padding: 0.875rem 1.25rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }

        .btn-reset {
            background: linear-gradient(135deg, #2a4743 0%, #2a4743 100%);
            border: none;
            border-radius: 12px;
            padding: 0.875rem 2rem;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(13, 110, 253, 0.3);
        }

        .footer-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.9rem;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: white;
            text-decoration: underline;
        }

        .title {
            color: #495057;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .instruction-text {
            color: #495057;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        @media (max-width: 576px) {
            .reset-card {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            
            .logo {
                font-size: 2rem;
                top: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="background-container">
        <!-- Logo -->
        <div class="logo">inavvo.</div>
        
        <!-- Background Elements -->
        <div class="mountain-silhouette"></div>
        <div class="mountain-layer-1"></div>
        <div class="mountain-layer-2"></div>
        
        <!-- Floating Dots -->
        <div class="floating-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <!-- Reset Password Card -->
        <div class="reset-card">
            <div class="text-center">
                <h2 class="title">Mot de passe oublié?</h2>
                <p class="subtitle">Réinitialiser le mot de passe avec Audit Académie</p>
                
                <div class="email-icon">
                    <i class="far fa-envelope"></i>
                </div>
                
                <p class="instruction-text">
                    Entrez votre adresse e-mail et les instructions vous seront envoyées !
                </p>
            </div>
            
            <form id="resetForm">
                <div class="mb-3">
                    <label for="email" class="form-label fw-medium">Email</label>
                    <input 
                        type="email" 
                        class="form-control" 
                        id="email" 
                        placeholder="Entrer votre email"
                        required
                    >
                    <div class="invalid-feedback">
                        Veuillez entrer une adresse email valide.
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-reset">
                    Modifier le mot de passe
                </button>
            </form>
        </div>
        
        <!-- Footer Link -->
        <a href="connexion.html" class="footer-link" id="rememberLink">
            Attendez-le me souviens de mon mot de passe. Cliquez ici
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('resetForm');
            const emailInput = document.getElementById('email');
            const rememberLink = document.getElementById('rememberLink');
            
            form.addEventListener('submit', async function(e) {
    e.preventDefault();

    // Reset previous validation states
    emailInput.classList.remove('is-invalid', 'is-valid');

    // Validate email
    const email = emailInput.value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!email || !emailRegex.test(email)) {
        emailInput.classList.add('is-invalid');
        emailInput.focus();
        return;
    }

    emailInput.classList.add('is-valid');

    // Prépare le bouton
    const button = form.querySelector('button[type="submit"]');
    const originalText = button.textContent;
    button.disabled = true;
    button.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Envoi en cours...';

    // Appel API
    try {
        const response = await fetch('https://imaneapi.auditacademie.com/api/demande_modification_mot_de_passe/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok) {
            alert('Un lien de réinitialisation a été envoyé à votre adresse email !');
            form.reset();
            emailInput.classList.remove('is-valid');
        } else {
            // Affiche le message d’erreur de l’API si disponible
            alert(data.detail || "Erreur lors de l'envoi. Veuillez réessayer.");
        }
    } catch (error) {
        alert("Erreur réseau. Veuillez réessayer.");
    } finally {
        button.disabled = false;
        button.textContent = originalText;
    }
});
            
            // // Remember password link handler
            // rememberLink.addEventListener('click', function(e) {
            //     e.preventDefault();
            //     alert('Redirection vers la page de connexion...');
            // });
            
            // Real-time email validation
            emailInput.addEventListener('input', function() {
                if (this.classList.contains('is-invalid')) {
                    this.classList.remove('is-invalid');
                }
            });
            
            // Add floating animation to dots
            function createFloatingDots() {
                const container = document.querySelector('.floating-dots');
                
                setInterval(() => {
                    if (Math.random() > 0.7) {
                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        dot.style.left = Math.random() * 100 + '%';
                        dot.style.top = Math.random() * 100 + '%';
                        dot.style.animationDelay = '0s';
                        
                        container.appendChild(dot);
                        
                        setTimeout(() => {
                            if (dot.parentNode) {
                                dot.parentNode.removeChild(dot);
                            }
                        }, 6000);
                    }
                }, 3000);
            }
            
            createFloatingDots();
        });
    </script>
</body>
</html>
