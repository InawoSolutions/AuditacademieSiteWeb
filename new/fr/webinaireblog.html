        .header {
      background-color: #fff;
      color: #333;
      padding: 20px 0;
      text-align: center;
      margin-bottom: 30px;
       margin-top: 80px;
    }
    
    .webinar-card {
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
      background-color: #fff;
      transition: transform 0.3s ease;
    }
    
    .webinar-card:hover {
      transform: translateY(-5px);
    }
    
    .webinar-image {
      position: relative;
      background-color: #a0a8b3;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .webinar-image .placeholder {
      width: 60px;
      height: 60px;
    }
    
    .webinar-image .dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 15px;
      height: 15px;
      background-color: white;
      border-radius: 50%;
    }
    
    .webinar-content {
      padding: 15px;
    }
    
    .webinar-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      min-height: 40px;
    }
    
    .btn-register {
      background-color: #2d4a43;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px 0;
      width: 100%;
      font-size: 14px;
      transition: background-color 0.3s ease;
    }
    
    .btn-register:hover {
      background-color: #1d3530;
    }
    
    .webinar-container {
      padding: 0 30px;
    }
    
    .webinar-wrapper {
      background-color: #f9f9f9;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    </style>

     <body>
  <div class="container-fluid p-0">
    <!-- Header -->
    <div class="header">
      <h1>Nos Webinaires</h1>
    </div>
    
    <!-- Webinar Grid -->
    <div class="webinar-container">
      <div class="row g-4" id="webinar-grid">
        <!-- Webinar cards will be inserted here by JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // Webinar data
    const webinars = [
      {
        title: "Introduction au marketing digital",
        image: "placeholder.svg",
        id: 1
      },
      {
        title: "Introduction au marketing digital",
        image: "placeholder.svg",
        id: 2
      },
      {
        title: "Développement web pour débutants",
        image: "placeholder.svg",
        id: 3
      },
      {
        title: "Stratégies avancées en e-commerce",
        image: "placeholder.svg",
        id: 4
      },
      {
        title: "Stratégies avancées en e-commerce",
        image: "placeholder.svg",
        id: 5
      },
      {
        title: "Stratégies avancées en e-commerce",
        image: "placeholder.svg",
        id: 6
      },
      {
        title: "Stratégies avancées en e-commerce",
        image: "placeholder.svg",
        id: 7
      },
      {
        title: "Stratégies avancées en e-commerce",
        image: "placeholder.svg",
        id: 8
      }
    ];

    // Function to create webinar cards
    function createWebinarGrid() {
      const webinarGrid = document.getElementById('webinar-grid');
      
      webinars.forEach(webinar => {
  const webinarCard = document.createElement('div');
  webinarCard.className = 'col-lg-3 col-md-6 col-sm-12';
  webinarCard.innerHTML = `
    <div class="webinar-wrapper">
      <div class="webinar-card">
        <div class="webinar-image">
          <svg class="placeholder" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.29 7 12 12 20.71 7"></polyline>
            <line x1="12" y1="22" x2="12" y2="12"></line>
          </svg>
          <div class="dot"></div>
        </div>
        <div class="webinar-content">
          <h3 class="webinar-title">${webinar.title}</h3>
          <a class="btn btn-register" data-id="${webinar.id}" href="#">Participer</a>
        </div>
      </div>
    </div>
  `;
  webinarGrid.appendChild(webinarCard);
});

document.querySelectorAll('.btn-register').forEach(btn => {
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    const webinarId = this.getAttribute('data-id');
    const isLoggedIn = localStorage.getItem('userToken') !== null;
    if (isLoggedIn) {
      window.location.href = `webinairedetail.html?id=${webinarId}`;
    } else {
      window.location.href = `inscriptionwebinaire.html?id=${webinarId}`;
    }
  });
});
      
      // Add event listeners to all register buttons
      // document.querySelectorAll('.btn-register').forEach(button => {

      //     const webinarId = this.getAttribute('data-id');
      //     registerForWebinar(webinarId);
      //   });
      // });
    }

    // Function to handle webinar registration
    // function registerForWebinar(webinarId) {
    //   // This would typically send a request to your backend
    //   console.log(`Registering for webinar ID: ${webinarId}`);
    //   alert(`Vous êtes inscrit au webinaire #${webinarId}`);
    // }

    // Initialize the webinar grid when the page loads
    document.addEventListener('DOMContentLoaded', createWebinarGrid);
  </script>

    <script>
        // Vérifie si l'utilisateur préfère le mode sombre
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        body {
            background-color: white;
            color: black;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: white;
            }
        }
        .icon-hover {
            transition: stroke 0.3s ease;
        }
        .features-item:hover .icon-hover {

        }
