        .login-container {

        .mountain-bg {

        .stars {

        .star {

            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;

        .star:nth-child(1) { top: 20%; left: 15%; }
        .star:nth-child(2) { top: 30%; left: 80%; }
        .star:nth-child(3) { top: 60%; left: 25%; }
        .star:nth-child(4) { top: 15%; left: 70%; }
        .star:nth-child(5) { top: 45%; left: 90%; }

        .logo {

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            margin-bottom: 4rem;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-label {
            color: #333;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--main-color);
            box-shadow: 0 0 0 0.2rem rgba(42, 71, 67, 0.25);
        }

        .is-invalid {
            border-color: #dc3545 !important;
        }

        .invalid-feedback {
            display: none;
            color: #dc3545;
            font-size: 0.85em;
            margin-top: 0.25rem;
        }

        .form-control.is-invalid ~ .invalid-feedback {
            display: block;
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 0;
        }

        .forgot-password {
            color: var(--main-color);
            text-decoration: none;
            font-size: 0.85rem;
            float: right;
            margin-top: 0.5rem;
        }

        .forgot-password:hover {
            color: #5a6fd8;
            text-decoration: underline;
        }

        .remember-me {
            margin: 1.5rem 0;
        }

        .form-check-input:checked {
            background-color: var(--main-color);
            border-color: var(--main-color);
        }

        .form-check-label {
            color: #666;
            font-size: 0.9rem;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--main-color) 0%, #667eea 100%);
            border: none;
            border-radius: 10px;
            padding: 0rem;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(42, 71, 67, 0.3);
            color: white;
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        .signup-link a {
            color: var(--main-color);
            text-decoration: none;
            font-weight: 500;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.8rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .login-card {
                margin: 1rem;
                padding: 2rem;
            }
            
            .logo {
                font-size: 1.5rem;
                margin-bottom: 2rem;
            }
        }

        <div class="mountain-bg"></div>

        </div>
        
        <div class="container-fluid h-100">
            <div class="row h-100 align-items-center justify-content-center">
                <div class="col-12">
                    <div class="logo fw-bold" >Audit Académie</div>
                    
                    <div class="login-card">
                        <h2 class="login-title">Pour lire des articles </h2>
                        <p class="login-subtitle">Connectez-vous maintenant ici.</p>
                        
                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Entrez votre email" required>
                                <div class="invalid-feedback" id="emailError">Veuillez entrer un email valide.</div>
                            </div>
                            
                            <div class="mb-2">
                                <label for="password" class="form-label">Mot de passe</label>
                                <div class="password-container">
                                    <input type="password" class="form-control" id="password" placeholder="Entrez votre mot de passe" required>
                                    <button type="button" class="password-toggle" id="togglePassword">

                                    </button>
                                </div>
                                <div class="invalid-feedback" id="passwordError">Veuillez entrer votre mot de passe.</div>
                                <a href="motdepasseoubliesite.html" class="forgot-password">Mot de passe oublié ?</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password toggle functionality
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

        // Form validation and API connexion
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            let valid = true;

            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            // Reset
            emailInput.classList.remove('is-invalid');
            passwordInput.classList.remove('is-invalid');
            emailError.style.display = 'none';
            passwordError.style.display = 'none';

            // Email validation
            const emailValue = emailInput.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailValue || !emailRegex.test(emailValue)) {
                emailInput.classList.add('is-invalid');
                emailError.style.display = 'block';
                valid = false;
            }

            // Password validation
            if (!passwordInput.value.trim()) {
                passwordInput.classList.add('is-invalid');
                passwordError.style.display = 'block';
                valid = false;
            }

            if (!valid) return;

            // Connexion à l'API
            const data = {
                email: emailInput.value.trim(),
                password: passwordInput.value
            };

            try {
                const response = await fetch('https://imaneapi.auditacademie.com/api/connexion/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

               if (response.ok) {
    // Connexion réussie, tu peux stocker le token ou rediriger
    // const result = await response.json();
    window.location.href = "blog-details.html"; // Redirection automatique
} else {
                    const error = await response.json();
                    alert('Erreur : ' + (error.message || 'Identifiants invalides.'));
                }
            } catch (err) {
                alert('Erreur réseau ou serveur.');
            }
        });

        // Add floating animation to stars
        function animateStars() {
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                const delay = index * 0.5;
                star.style.animation = `float 3s ease-in-out ${delay}s infinite alternate`;
            });
        }

        // CSS animation for floating effect
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0% { transform: translateY(0px) scale(1); opacity: 0.8; }
                100% { transform: translateY(-10px) scale(1.1); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        // Initialize animations
        animateStars();

        // Add subtle parallax effect to mountains
        window.addEventListener('mousemove', function(e) {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            const mountainBg = document.querySelector('.mountain-bg');
            const translateX = (mouseX - 0.5) * 20;
            const translateY = (mouseY - 0.5) * 10;
            
            mountainBg.style.transform = `translate(${translateX}px, ${translateY}px)`;
        });
    </script>
