        // Load webinar data
        function loadWebinarData(data) {
    // Met à jour le titre de la page
    document.getElementById('page-title').textContent = data.titre + ' - Webinaire';

    // Met à jour la section hero
    document.getElementById('webinar-title').textContent = data.titre;
    document.getElementById('webinar-description').textContent = data.description;
    document.getElementById('speaker-name').textContent = data.animateur;

    // Met à jour le statut
    const statusInfo = statusConfig[data.etat];
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');

    statusBadge.className = `status-badge ${statusInfo.class}`;
    statusText.innerHTML = `<i class="${statusInfo.icon} me-2"></i>${statusInfo.text}`;

    // Met à jour la classe de la section hero
    const heroSection = document.getElementById('hero-section');
    if (statusInfo.heroClass) {
        heroSection.classList.add(statusInfo.heroClass);
    }

    // Met à jour la classe de la section action
    const actionSection = document.getElementById('action-section');
    if (statusInfo.actionClass) {
        actionSection.classList.add(statusInfo.actionClass);
    }

    // Charge l'image du webinaire
    loadWebinarImage(data.image);

    // Charge les infos du webinaire
    loadWebinarInfo(data);

    // Charge la section support
    loadSupportSection(data);

    // Charge la section action
    loadActionSection(data);

    // Lance le compte à rebours si prévu
    if (data.etat === 'prévu') {
        startCountdown(data.date_heure);
    }
}

        // Load webinar image
        function loadWebinarImage(imagePath) {
    const container = document.getElementById('webinar-image-container');
    let imageURL = '../assets/images/blog/post-4.jpg';
    if (imagePath && imagePath.startsWith('/photos')) {
        imageURL = 'https://imaneapi.auditacademie.com' + imagePath;
    } else if (imagePath) {
        imageURL = imagePath;
    }
    if (imagePath) {
        container.innerHTML = `<img src="${imageURL}" alt="Image du webinaire" class="webinar-image">`;
    } else {
        container.innerHTML = `
            <div class="webinar-image-placeholder">
                <i class="bi bi-image"></i>
            </div>
        `;
    }
}

        // Load webinar info
        function loadWebinarInfo(data) {
            const container = document.getElementById('webinar-info');
            const dateTime = new Date(data.date_heure);
            const dateStr = dateTime.toLocaleDateString('fr-FR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'

        // Countdown timer
        function startCountdown(targetDate) {
            const countdownElement = document.getElementById('countdown-timer');
            countdownElement.style.display = 'block';
            
            function updateCountdown() {
                const target = new Date(targetDate).getTime();
                const now = new Date().getTime();
                const difference = target - now;
                
                if (difference > 0) {
                    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((difference % (1000 * 60)) / 1000);
                    
                    document.getElementById('days').textContent = days.toString().padStart(2, '0');
                    document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                    document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                    document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
                } else {
                    countdownElement.style.display = 'none';
                }
            }
            
            countdownInterval = setInterval(updateCountdown, 1000);
            updateCountdown();
        }

        });

<script>
    // Utilitaire pour obtenir l'ID depuis l'URL
    function getWebinarIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }

    // Mappe les statuts API vers ceux du front
    function mapStatutAPI(statut) {
        switch (statut) {
            case 'à_venir': return 'prévu';
            case 'en_cours': return 'en_cours';
            case 'termine': return 'terminé';
            case 'annule': return 'annulé';
            default: return 'prévu';
        }
    }

    // Charge les données depuis l'API
    async function fetchWebinarData(id) {
        try {
            const response = await fetch(`https://imaneapi.auditacademie.com/api/webinaires/${id}/`);
            if (!response.ok) throw new Error('Erreur API');
            const data = await response.json();
            return data;
        } catch (e) {
            alert("Impossible de charger le webinaire.");
            return null;
        }
    }

    // Initialise la page avec l'API
    async function initializePage() {
        const id = getWebinarIdFromUrl();
        if (!id) {
            alert("Webinaire introuvable.");
            return;
        }
        document.getElementById('loading').style.display = 'block';
        document.getElementById('main-content').style.display = 'none';

        const data = await fetchWebinarData(id);
        console.log(data);
        if (!data) return;

        // Adaptation des champs pour correspondre à l'ancien code
        const webinarData = {
    id: data.id,
    titre: data.titre,
    description: data.description,
    date_heure: data.date + "T" + data.heure_debut,
    duree_minutes: getDurationMinutes(data.heure_debut, data.heure_fin),
    animateur: data.utilisateur ? data.utilisateur.nom : "Animateur inconnu",
    lien: data.lien_acces,
    capacite_max: data.nombre_participants_max,
    etat: mapStatutAPI(data.statut),
    support_disponible: !!data.support_pdf || !!data.lien_replay,
    support_telechargement: data.support_pdf,
    image: data.image,
    inscriptions_actuelles: data.participants ? data.participants.length : 0,
    lien_replay: data.lien_replay,
    type: data.type // <-- AJOUTE CE CHAMP
};

        // Remplace les anciennes fonctions par celles qui utilisent webinarData
        window.webinarData = webinarData; // Pour accès global dans d'autres scripts
loadWebinarData(window.webinarData);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        setupLienParticipation();
    }

    // Calcule la durée en minutes
    function getDurationMinutes(start, end) {
        const [h1, m1] = start.split(':').map(Number);
        const [h2, m2] = end.split(':').map(Number);
        return (h2 * 60 + m2) - (h1 * 60 + m1);
    }

    // Surcharge la fonction loadSupportSection pour gérer le replay
    function loadSupportSection(data) {
        const section = document.getElementById('support-section');
        const content = document.getElementById('support-content');

                            <i class="bi bi-download me-2"></i>Télécharger
                        </a>
                    </div>
                `;
            }
            if (data.lien_replay) {
                supportItems += `
                    <div class="support-item">
                        <div class="support-icon">
                            <i class="bi bi-play-circle"></i>
                        </div>

                `;
            }
            content.innerHTML = supportItems;
        }
    }

    document.addEventListener('DOMContentLoaded', initializePage);
    
function setupLienParticipation() {
    var btn = document.getElementById('btn-lien-participation');
    var message = document.getElementById('message-copie');
    if (!btn) return;

    // Remplace le bouton pour supprimer les anciens listeners
    var newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    btn = newBtn;

    // Vérifie si le webinaire est payant
    if (window.webinarData && window.webinarData.type === 'Payant') {
    // btn.classList.add('disabled'); // <-- retire cette ligne
    btn.title = "Ce webinaire est payant. Veuillez vous abonner pour obtenir le lien.";
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        alert("Ce webinaire est payant. Veuillez vous abonner pour obtenir le lien de participation.");
    });
    return;
}

    btn.classList.remove('disabled');
    btn.title = "Copier le lien de participation";

    btn.addEventListener('click', function() {
        if (!window.webinarData || !window.webinarData.lien) {
            alert("Lien non disponible.");
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(window.webinarData.lien).then(function() {
                message.style.display = 'inline';
                setTimeout(function() {
                    message.style.display = 'none';
                }, 2000);
            }, function() {
                prompt("Copiez ce lien :", window.webinarData.lien);
            });
        } else {
            prompt("Copiez ce lien :", window.webinarData.lien);
        }
    });
}
