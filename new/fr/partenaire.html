        <script>
            document.addEventListener("DOMContentLoaded", function() {
                var input = document.querySelector("#tel");
                var iti = window.intlTelInput(input, {
                    separateDialCode: true, 
                    initialCountry: "bj", 
                    preferredCountries: ["bj", "fr", "gb", "us"], 
                    utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js" // Gère le formatage des numéros
                });
                input.addEventListener("countrychange", function() {
                    var countryData = iti.getSelectedCountryData();
                    input.value = "+" + countryData.dialCode + " ";
                });
            });
        </script>
        <script>
          document.addEventListener('DOMContentLoaded', function () {
    // Gestion du formulaire d'inscription
    document.getElementById('insform').addEventListener('submit', function (event) {
        // Empêche l'envoi par défaut du formulaire
        event.preventDefault();

        // Récupérer les valeurs des champs du formulaire
        const nom = document.getElementById('nom').value;
        const prenom = document.getElementById('prenom').value;
        const fonction = document.getElementById('fonction').value || ""; // Valeur par défaut si vide
        const societe = document.getElementById('societe').value || ""; // Valeur par défaut si vide
        const telephone = document.getElementById('tel').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const type_utilisateur = "Affilie";

        // Validation des champs obligatoires
        if (!nom || !prenom || !telephone || !email || !password) {
            document.getElementById('error-message').innerText = "Veuillez remplir tous les champs obligatoires";
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('error-message').style.color = 'red';
            return;
        }

        // Créer l'objet JSON à envoyer
        const data = {
            email: email,
            password: password,
            nom: nom,
            prenom: prenom,
            telephone: telephone,
            societe: societe || null, // S'assurer qu'une valeur vide devient null si nécessaire
            fonction: fonction || null, // S'assurer qu'une valeur vide devient null si nécessaire
            langue: "Fr", // Par défaut en français
            type_utilisateur: type_utilisateur // Type utilisateur partenaire
        };

        console.log("Données à envoyer:", data); // Pour déboguer les données envoyées

        // Afficher un indicateur de chargement
        document.getElementById('suivantBtn').innerHTML = '<span>Chargement...</span>';
        document.getElementById('suivantBtn').disabled = true;

        // Envoyer les données à l'API avec Axios
        axios.post('https://inawoapiv3.inawo.pro/utilisateurs/inscription/', data)
            .then(function (response) {
                console.log('Inscription réussie:', response.data);

                // Cacher wrapper et afficher wrapper2 (écran de succès)
                document.getElementById('wrapper').style.display = 'none';
                document.getElementById('wrapper2').style.display = 'block';
            })
            .catch(function (error) {
                console.error('Erreur lors de l\'inscription:', error);

                // Afficher un message d'erreur détaillé pour le débogage
                let errorMessage = "Une erreur s'est produite lors de l'inscription. Veuillez réessayer.";

                if (error.response) {
                    console.log("Détails de l'erreur:", error.response.data); // Afficher les détails de l'erreur

                    // Vérifier différents formats possibles de message d'erreur
                    if (error.response.data && error.response.data.message) {
                        errorMessage = error.response.data.message;
                    } else if (error.response.data && error.response.data.detail) {
                        errorMessage = error.response.data.detail;
                    } else if (error.response.status === 409) {
                        errorMessage = "Cette adresse email est déjà utilisée.";
                    } else if (error.response.status === 400) {
                        // Pour les erreurs 400, essayons d'extraire les messages d'erreur spécifiques
                        const errorData = error.response.data;
                        if (typeof errorData === 'object') {
                            const errorMessages = [];
                            for (const field in errorData) {
                                if (Array.isArray(errorData[field])) {
                                    errorMessages.push(`${field}: ${errorData[field].join(', ')}`);
                                } else if (typeof errorData[field] === 'string') {
                                    errorMessages.push(`${field}: ${errorData[field]}`);
                                }
                            }
                            if (errorMessages.length > 0) {
                                errorMessage = errorMessages.join('\n');
                            }
                        }
                    }
                }

                document.getElementById('error-message').innerText = errorMessage;
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('error-message').style.color = 'red';

                // Réactiver le bouton
                document.getElementById('suivantBtn').innerHTML = '<span>Créer mon compte</span>';
                document.getElementById('suivantBtn').disabled = false;
            });
    });
});
