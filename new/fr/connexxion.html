    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password toggle functionality
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

          const urlParams = new URLSearchParams(location.search);
        const redirect = urlParams.get('next');
        const inscriptionLink = document.querySelector('.signup-link a');
        if(redirect) {
            inscriptionLink.href = `inscription?next=${redirect}`;
        } else {
            inscriptionLink.href = 'inscription.html';
        }
        // Form validation and API connexion
        const formLogin = document.getElementById('loginForm');
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();

            let valid = true;

            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            // Reset
            emailInput.classList.remove('is-invalid');
            passwordInput.classList.remove('is-invalid');
            emailError.style.display = 'none';
            passwordError.style.display = 'none';

            // Email validation
            const emailValue = emailInput.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailValue || !emailRegex.test(emailValue)) {
                emailInput.classList.add('is-invalid');
                emailError.style.display = 'block';
                valid = false;
            }

            // Password validation
            if (!passwordInput.value) {
                passwordInput.classList.add('is-invalid');
                passwordError.style.display = 'block';
                valid = false;
            }

            if (!valid) return;

            // Connexion à l'API
            const data = {
                email: emailInput.value.trim(),
                password: passwordInput.value
            };

            try {
                const url = 'https://imaneapi.auditacademie.com/api/connexion/';
                const options = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                };
                const response = await fetch(url, options);
                console.log("Réponse de l'API:", response);

                // ...dans le bloc if (response.ok) { ... }
                if (response.ok) {
    const result = await response.json();
    // Vérifie le type d'utilisateur
    if (result.user_info && result.user_info.user_type !== "CONTACTE ") {
        alert("Seuls les utilisateurs de type CONTACTE peuvent se connecter ici.");
        return;
    }

    // Stocke le token si besoin
    if (result.access_token) {
        document.cookie = `token=${result.access_token}; path=/; max-age=${60 * 60 * 24 * 7}`;
        localStorage.setItem('userToken', result.access_token);
    }

    if (result.user_info) {
        localStorage.setItem('first_name', result.user_info.first_name || '');
        localStorage.setItem('last_name', result.user_info.last_name || '');
        localStorage.setItem('user_id', result.user_info.id);
        localStorage.setItem('email', result.user_info.email || '');
        const aba = result.abonnement_article.length && result.abonnement_article.length > 0 ? "actif": "inactif";
        localStorage.setItem("abonnement_article",  aba);
localStorage.setItem('phone', result.user_info.tel || '-');
        // localStorage.setItem('abonnement_article', result.abonnement_article.statut_abonnement);
    }

    // Redirection intelligente après connexion

    if (redirect) {
        location.href = `../fr/${redirect}`;
    } else {
        location.href = "../fr/";
    }
} else {
                    const error = await response.json();
                    alert('Erreur : ' + (error.message || 'Identifiants invalides.'));
                }
            } catch (err) {
                alert('Erreur réseau ou serveur.');
            }
        });

        // Add floating animation to stars
        function animateStars() {
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                const delay = index * 0.5;
                star.style.animation = `float 3s ease-in-out ${delay}s infinite alternate`;
            });
        }

        // CSS animation for floating effect
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0% { transform: translateY(0px) scale(1); opacity: 0.8; }
                100% { transform: translateY(-10px) scale(1.1); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        // Initialize animations
        animateStars();

        // Add subtle parallax effect to mountains
        window.addEventListener('mousemove', function (e) {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            const mountainBg = document.querySelector('.mountain-bg');
            const translateX = (mouseX - 0.5) * 20;
            const translateY = (mouseY - 0.5) * 10;

            mountainBg.style.transform = `translate(${translateX}px, ${translateY}px)`;
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.cookie = "token=; path=/; max-age=0";
                    window.location.href = "connexion.html";

            }
        });
